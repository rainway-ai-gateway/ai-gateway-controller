apiVersion: v1
kind: ServiceAccount
metadata:
  name: bfe-ai-gateway-controller
  namespace: default
  labels:
    app.kubernetes.io/name: bfe-ai-gateway-controller
    app.kubernetes.io/instance: bfe-ai-gateway-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  #namespace as postfix
  name: bfe-ai-gateway-controller-default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: bfe-ai-gateway-controller
  namespace: default
