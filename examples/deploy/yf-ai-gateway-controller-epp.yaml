apiVersion: apps/v1
kind: Deployment
metadata:
  name: yf-ai-gateway-controller-epp
  namespace: default
  labels:
    app.kubernetes.io/name: yf-ai-gateway-controller-epp
    app.kubernetes.io/instance: yf-ai-gateway-controller-epp
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app.kubernetes.io/name: yf-ai-gateway-controller-epp
      app.kubernetes.io/instance: yf-ai-gateway-controller-epp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yf-ai-gateway-controller-epp
        app.kubernetes.io/instance: yf-ai-gateway-controller-epp
    spec:
      serviceAccountName: yf-ai-gateway-controller
      containers:
        - name: yf-ai-gateway-controller
          imagePullPolicy: Always
          image: 172.18.1.244:5000/ai-gateway-controller:latest
          env:
          - name: ILB_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-bfe-apiserver-demo
                key: ilb-api-token
          command: [ "/ai-gateway-controller" ]
          args:
            - '-ilb-api-addr=http://172.18.1.196:8910'
            - '-ilb-api-token=Token $(ILB_API_TOKEN)'
            - '-k8s-cluster-name=szyf'
            - '-ilb-product-name=AI_product'
            - '-ilb-api-name=bfe-apiserver-demo'
            - '-enable-alb-pool=true'
            - '-enable-rs-pool=false'
            # - '-nlb-access-type=DirectEndpoint'
            # - '-nlb-cluster-name=nlbcluster-yxy-test'
            # - '-flannel-annotation-prefix=flannel.alpha.coreos.com'
            - '-enable-inference-pool=true'
            - '-enable-epp-service=false'
            - '-enable-inference-pool-label-filter=false'
            - '-enable-aipool-path=true'
            - '-pushgateway-addr= '
            - '-heartbeat-interval=30'
            - '-set-delete-as-clear=false'
            - '-force-rm-finalizer=false'
          ports:
            - containerPort: 9081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            runAsUser: 1000       # yfuser defined in Dockerfile
            runAsGroup: 1000      # yfgroup defined in Dockerfile
            runAsNonRoot: true            
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "500m"     
              memory: "500Mi"   
            limits:
              cpu: "1"       
              memory: "2Gi"   
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}

