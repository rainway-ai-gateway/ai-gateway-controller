apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  namespace: open-bfe-demo
  name: vllm-sim-inference-pool
spec:
  selector:
    matchLabels:
      app: vllm-sim-inference-pool
  endpointPickerRef:
    name: vllm-sim-endpoint-picker
    kind: Service
    port:
      number: 9002
  targetPorts:
  - number: 8200
