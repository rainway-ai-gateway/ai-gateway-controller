apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  labels:
    app: vllm-sim-inference-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-sim-inference-pool
  template:
    metadata:
      labels:
        app: vllm-sim-inference-pool
    spec:
      containers:
      - name: vllm
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--port=8200"
        - "--model=food-review"
        - "--enable-kvcache=false"
        - "--kv-cache-size=1024"
        - "--block-size=16"
          # - "--zmq-endpoint=tcp://vllm-sim-endpoint-picker.default.svc.cluster.local:5557"
        - "--event-batch-size=16"
        - "--tokenizers-cache-dir=/tokenizer-cache"
        - "--data-parallel-size=1"
        ports:
        - name: http
          containerPort: 8200
          protocol: TCP
        - name: rank1
          containerPort: 8201
          protocol: TCP
        - name: rank2
          containerPort: 8202
          protocol: TCP
        - name: rank3
          containerPort: 8203
          protocol: TCP
        - name: rank4
          containerPort: 8204
          protocol: TCP
        - name: rank5
          containerPort: 8205
          protocol: TCP
        - name: rank6
          containerPort: 8206
          protocol: TCP
        - name: rank7
          containerPort: 8207
          protocol: TCP
        env:
        - name: PORT
          value: "8200"
        - name: PYTHONHASHSEED
          value: "42"
        volumeMounts:
        - name: tokenizer-cache
          mountPath: /tokenizer-cache
      volumes:
      - name: tokenizer-cache
        emptyDir: {}

