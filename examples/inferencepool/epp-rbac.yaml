kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: open-bfe-demo
  name: vllm-sim-endpoint-picker
rules:
- apiGroups:
  - "inference.networking.x-k8s.io"
  resources:
  - "inferencepools"
  - "inferenceobjectives"
  verbs:
  - "get"
  - "watch"
  - "list"
- apiGroups:
  - "inference.networking.k8s.io"
  resources:
  - "inferencepools"
  verbs:
  - "get"
  - "watch"
  - "list"
- apiGroups:
  - ""
  resources:
  - "pods"
  verbs:
  - "get"
  - "watch"
  - "list"
- apiGroups: [""] 
  resources: ["configmaps"]
  verbs: 
    - "get"
    - "create"
    - "delete"
    - "list"   
    - "watch"  
    - "update"
- apiGroups:
  - "authentication.k8s.io"
  resources:
  - "tokenreviews"
  verbs:
  - "create"
- apiGroups:
  - "authorization.k8s.io"
  resources:
  - "subjectaccessreviews"
  verbs:
  - "create"
